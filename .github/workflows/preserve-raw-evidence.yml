name: Preserve raw Actions evidence
on:
  push:
    paths:
      - .github/workflows/preserve-raw-evidence.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: preserve-raw-evidence
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_TAG: raw-actions-backup-2026-11-17
    steps:
      - name: Preserve original artifacts in a durable release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw bundles
          python3 - <<'PY'
          import os,json,urllib.request,time,hashlib,csv,tarfile,pathlib
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          api='https://api.github.com/repos/'+repo
          def req(url):
              return urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'preserve-raw-evidence'})
          arts=[];page=1
          while True:
              with urllib.request.urlopen(req(api+'/actions/artifacts?per_page=100&page='+str(page)),timeout=60) as h:data=json.load(h)['artifacts']
              if not data:break
              arts.extend(a for a in data if not a['expired'])
              if len(data)<100:break
              page+=1
          arts=sorted(arts,key=lambda a:a['id'])
          rows=[];group=[]
          for idx,a in enumerate(arts):
              name='artifact_'+str(a['id'])+'.zip'
              path=pathlib.Path('raw')/name
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req(api+'/actions/artifacts/'+str(a['id'])+'/zip'),timeout=120) as h:path.write_bytes(h.read())
                      break
                  except Exception:
                      if attempt==3:raise
                      time.sleep(4*(attempt+1))
              blob=path.read_bytes()
              rows.append([a['id'],a['name'],len(blob),hashlib.sha256(blob).hexdigest(),a.get('expires_at',''),a.get('workflow_run',{}).get('id',''),name])
              group.append(path)
              if len(group)>=20 or idx==len(arts)-1:
                  dest=pathlib.Path('bundles')/('raw_bundle_'+str((idx//20)+1).zfill(3)+'.tar')
                  with tarfile.open(dest,'w') as tar:
                      for item in group:tar.add(item,arcname=item.name)
                  for item in group:item.unlink()
                  group=[]
          with open('bundles/original_artifact_manifest.csv','w',newline='') as h:
              w=csv.writer(h);w.writerow(['artifact_id','name','bytes','sha256','expires_at','workflow_run_id','filename']);w.writerows(rows)
          with open('bundles/backup_status.json','w') as h:
              json.dump({'repository':repo,'artifact_count':len(rows),'total_bytes':sum(r[2] for r in rows),'snapshot_tag':os.environ['SNAPSHOT_TAG']},h,indent=2)
          print('Preserved',len(rows),'artifacts')
          PY
          gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "Raw research evidence backup (2026-11-17)" --notes "Original GitHub Actions artifacts preserved without modifying their contents. Verify against original_artifact_manifest.csv."
          gh release upload "$SNAPSHOT_TAG" bundles/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length'
