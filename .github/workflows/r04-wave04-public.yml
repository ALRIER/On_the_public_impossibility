name: R04 public Wave04 surrogate competition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/r04-wave04-trigger.txt'

permissions:
  contents: write

concurrency:
  group: r04-public-wave04
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  select_models:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [extratrees, hgb, catboost]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate neutral bundle
        run: python src/validate_neutral_bundle.py --input-dir inputs/r04
      - name: Run model family
        shell: bash
        run: |
          python src/r04_surrogate_search.py \
            --model "${{ matrix.model }}" \
            --input-dir inputs/r04 \
            --output-dir "outputs/r04/selection-${{ matrix.model }}" \
            --trials 60 \
            --virtual-points 65536 \
            --reserve-cpus 0 \
            --reserve-ram-gb 1.0 \
            --ram-per-worker-gb 2.0 \
            --parallel-trials 2
      - uses: actions/upload-artifact@v4
        with:
          name: r04-selection-${{ matrix.model }}
          path: outputs/r04/selection-${{ matrix.model }}
          if-no-files-found: error

  consensus_and_dedup:
    needs: select_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: r04-selection-extratrees
          path: /tmp/extratrees
      - uses: actions/download-artifact@v4
        with:
          name: r04-selection-hgb
          path: /tmp/hgb
      - uses: actions/download-artifact@v4
        with:
          name: r04-selection-catboost
          path: /tmp/catboost
      - name: Build consensus and deduplicated queue
        run: |
          python src/r04_consensus.py \
            --extratrees /tmp/extratrees \
            --hgb /tmp/hgb \
            --catboost /tmp/catboost \
            --output-dir outputs/r04/wave04
      - uses: actions/upload-artifact@v4
        with:
          name: r04-wave04-consensus
          path: outputs/r04/wave04
          if-no-files-found: error

  archive:
    needs: consensus_and_dedup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: r04-wave04-consensus
          path: /tmp/wave04
      - name: Stage compact neutral evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/r04/wave04
          mkdir -p outputs/r04/wave04
          cp -R /tmp/wave04/. outputs/r04/wave04/
          printf '%s\n' \
            'workflow_run_id,repository_commit,stage,models,trials_per_model,virtual_points,parallel_model_jobs,parallel_trials_per_runner,reserve_cpus,reserve_ram_gb,true_abm_executed,next_step' \
            "${GITHUB_RUN_ID},${GITHUB_SHA},public_wave04_surrogate,extratrees+hgb+catboost,60,65536,3,2,0,1.0,false,reconcile_candidates_before_private_ABM" \
            > outputs/r04/wave04/run_manifest.csv
      - name: Commit compact Wave04 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/r04/wave04
          git commit -m "Archive public R04 Wave04 surrogate consensus ${GITHUB_RUN_ID}" || exit 0
          for ATTEMPT in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((ATTEMPT * 2))
          done
          exit 1
