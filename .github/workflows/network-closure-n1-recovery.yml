name: Network Closure N1 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/network-closure-n1-recovery-trigger.txt"

permissions:
  contents: write

concurrency:
  group: network-closure-n1-recovery
  cancel-in-progress: false

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 6, 7, 11, 13, 14, 15, 16, 24, 27, 29, 33, 35, 42, 43, 45, 46, 47, 49, 52, 53, 54, 55, 58, 62]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout public laboratory
        uses: actions/checkout@v4
        with:
          path: lab

      - name: Checkout private runtime transiently
        uses: actions/checkout@v4
        with:
          repository: ALRIER/On_the_Impossibility_of_Central_Planning
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: runtime
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/code/requirements.txt

      - name: Run missing N1 shard
        shell: bash
        run: |
          mkdir -p lab/outputs/network_closure_n1_raw
          START=$(( ${{ matrix.shard }} * 16384 ))
          python runtime/code/stages/Test3/run_network_structural_closure_n1.py \
            --start ${START} \
            --count 16384 \
            --seed 6032026 \
            --output lab/outputs/network_closure_n1_raw/shard_${{ matrix.shard }}.csv

      - uses: actions/upload-artifact@v4
        with:
          name: network-n1-recovery-${{ matrix.shard }}
          path: lab/outputs/network_closure_n1_raw/shard_${{ matrix.shard }}.csv
          retention-days: 90
